# Shared field sets. Use them in any cms/*.yml file (core or site) as `fields: !core image`.

# An image: file, alt text and size.
image:
  - { name: src, label: Image, widget: image }
  - name: alt
    label: Alt text
    required: false
    hint: "Describe what the image shows in a few words, e.g. “[[image_alt_example]]”. Google (image search) and screen readers use it. Leave empty only for purely decorative images."
  - { name: width, label: Width (px), widget: number, required: false }
  - { name: height, label: Height (px), widget: number, required: false }

# A button: label and link.
button:
  - { name: label, label: Label }
  - name: link
    label: Link
    hint: 'A page URL (e.g. /pricing/), a full URL[[or_popup_link]].'

# "Hide this section": the first field of every section type (one field, used as `- !core hidden`).
hidden: { name: hidden, label: Hide this section, widget: boolean, required: false, default: false, hint: "Hidden sections stay saved but aren't shown on the site." }
